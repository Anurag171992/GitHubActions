# ============================================================
# GitHub Actions - iOS CI Workflow
# ============================================================
#
# Runs the CI checks required before changes can be merged into
# the main branch.
#
# Pipeline:
#
# Pull Request → main
#        ↓
# Checkout Repository
#        ↓
# Verify Required Secrets
#        ↓
# Verify CI Environment
#        ↓
# Build iOS App
#        ↓
# Run Unit Tests
#        ↓
# Generate Code Coverage
#        ↓
# Run SwiftLint
#        ↓
# CI Passed → PR can be merged
#
# The "build-and-test" job is configured as a required status
# check in the repository ruleset. If this job fails, the PR
# remains blocked from merging.
# ============================================================


# Name displayed for this workflow in the GitHub Actions tab.
name: iOS CI


# ============================================================
# TRIGGER
# ============================================================
#
# Runs this workflow for Pull Requests targeting the main branch.
#
# The workflow is triggered when a PR is created and can run
# again when new commits are pushed to the same PR.
#
# Typical flow:
#
# Feature Branch
#       ↓
# Push Changes
#       ↓
# Pull Request → main
#       ↓
# CI runs automatically
#
on:
  pull_request:
    branches:
      - main


# ============================================================
# JOBS
# ============================================================
#
# A workflow can contain one or more jobs.
#
# This workflow currently uses a single job called
# "build-and-test". All of its steps execute sequentially on
# the same runner.
#
# Workflow
#    ↓
# build-and-test
#    ↓
# Steps
#
jobs:
  build-and-test:

    # ========================================================
    # RUNNER
    # ========================================================
    #
    # Defines the machine/environment used to execute this job.
    #
    # The project requires an Xcode 27 compatible environment,
    # so the job uses the Xcode 27 runner.
    #
    # The runner provides macOS, Xcode and the command-line
    # tools required to build and test the iOS application.
    #
    runs-on: xcode-27


    # ========================================================
    # STEPS
    # ========================================================
    #
    # Steps execute sequentially inside this job.
    #
    # A failure in a required step causes the job to fail and
    # normally prevents the remaining steps from executing.
    #
    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout Repository
      # ------------------------------------------------------
      #
      # Makes the repository source code available inside the
      # runner's workspace.
      #
      # "uses" executes an existing reusable GitHub Action.
      # actions/checkout is GitHub's official checkout action.
      #
      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # STEP 2 - Verify Required Secret
      # ------------------------------------------------------
      #
      # Sensitive configuration should be stored in GitHub
      # Actions Secrets instead of being committed to source
      # control.
      #
      # Typical examples include:
      #
      # - API keys
      # - Access tokens
      # - Certificate passwords
      # - App Store Connect credentials
      #
      # DEMO_API_KEY is stored as a repository secret.
      #
      # `${{ secrets.DEMO_API_KEY }}` retrieves the secret at
      # runtime and assigns it to an environment variable named
      # DEMO_API_KEY for this step.
      #
      # Only the presence of the secret is checked here. The
      # actual value is never intentionally written to CI logs.
      #
      # If the secret is missing, exit 1 causes this step and
      # therefore the job to fail immediately.
      #
      - name: Verify Secret
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "Secret is missing"
            exit 1
          else
            echo "Secret is available"
          fi


      # ------------------------------------------------------
      # STEP 3 - Verify Runner
      # ------------------------------------------------------
      #
      # Simple diagnostic command confirming that the workflow
      # is executing commands on the macOS CI runner.
      #
      # "run" executes a shell command directly on the runner.
      #
      - name: Verify runner
        run: echo "Running CI on macOS"


      # ------------------------------------------------------
      # STEP 4 - Check Xcode Version
      # ------------------------------------------------------
      #
      # Prints the active Xcode version used by the CI runner.
      #
      # Keeping this information in the logs is useful when
      # investigating build failures caused by differences
      # between local and CI Xcode environments.
      #
      - name: Check Xcode version
        run: xcodebuild -version


      # ------------------------------------------------------
      # STEP 5 - List Installed Xcode Versions
      # ------------------------------------------------------
      #
      # Lists Xcode installations available on the runner.
      #
      # This is mainly a diagnostic step and is useful when
      # troubleshooting Xcode compatibility or runner changes.
      #
      - name: List installed Xcode versions
        run: ls /Applications | grep Xcode


      # ------------------------------------------------------
      # STEP 6 - Build iOS Application
      # ------------------------------------------------------
      #
      # xcodebuild is Apple's command-line tool for building
      # Xcode projects and workspaces.
      #
      # build:
      #   Performs the build operation.
      #
      # -project:
      #   Specifies the Xcode project that should be built.
      #
      # -scheme:
      #   Specifies the shared scheme used for the build.
      #
      # -sdk iphonesimulator:
      #   Builds the application against the iOS Simulator SDK.
      #
      # CODE_SIGNING_ALLOWED=NO:
      #   Disables code signing for this simulator build.
      #
      # Simulator builds do not require the signing certificate
      # and provisioning profile that would be required for a
      # physical-device or App Store distribution build.
      #
      # A concrete simulator destination is not required for
      # this build-only step.
      #
      - name: Build iOS App
        run: |
          xcodebuild build \
            -project GitHubActionsDemo.xcodeproj \
            -scheme GitHubActionsDemo \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO


      # ------------------------------------------------------
      # STEP 7 - Run Unit Tests
      # ------------------------------------------------------
      #
      # Executes the XCTest unit-test target on a specific iOS
      # Simulator.
      #
      # Tests require a concrete destination because the test
      # bundle needs an environment in which it can execute.
      #
      # -destination:
      #   Specifies the simulator used to execute the tests.
      #
      # -only-testing:
      #   Restricts execution to GitHubActionsDemoTests.
      #
      #   UI tests are excluded from this workflow so this job
      #   runs only the unit-test target.
      #
      # -enableCodeCoverage YES:
      #   Enables collection of code-coverage information while
      #   the tests execute.
      #
      # -resultBundlePath:
      #   Writes the XCTest result bundle to a predictable path.
      #
      #   The generated TestResults.xcresult bundle is read by
      #   the following code-coverage step.
      #
      # CODE_SIGNING_ALLOWED=NO:
      #   Prevents signing from being required for this simulator
      #   based test execution.
      #
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project GitHubActionsDemo.xcodeproj \
            -scheme GitHubActionsDemo \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -only-testing:GitHubActionsDemoTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO


      # ------------------------------------------------------
      # STEP 8 - Display Code Coverage
      # ------------------------------------------------------
      #
      # xccov is Apple's command-line utility for inspecting
      # code-coverage information stored in an .xcresult bundle.
      #
      # TestResults.xcresult is generated by the unit-test step.
      #
      # The report shows how much executable application code
      # was exercised during the test run.
      #
      # Coverage is used as a quality signal, but a high coverage
      # percentage alone does not guarantee correct test cases or
      # bug-free application behavior.
      #
      - name: Show Code Coverage
        run: xcrun xccov view --report TestResults.xcresult


      # ------------------------------------------------------
      # STEP 9 - Install SwiftLint
      # ------------------------------------------------------
      #
      # SwiftLint performs static analysis against Swift source
      # files and reports code-style and quality violations.
      #
      # SwiftLint is installed directly on the CI runner so the
      # workflow does not depend on individual developer-machine
      # configuration.
      #
      # The runner is temporary, so this installation applies to
      # the current CI environment.
      #
      - name: Install SwiftLint
        run: brew install swiftlint


      # ------------------------------------------------------
      # STEP 10 - Run SwiftLint
      # ------------------------------------------------------
      #
      # Scans the Swift source files using the configured
      # SwiftLint rules.
      #
      # A serious lint violation returns a non-zero exit code,
      # causing this job to fail.
      #
      # Because "build-and-test" is a required repository status
      # check, a lint failure also prevents the PR from being
      # merged until the issue is resolved and CI passes again.
      #
      # SwiftLint rules can be controlled locally when a specific
      # exception is required.
      #
      # Disable a rule from the current point:
      #
      #   // swiftlint:disable rule_name
      #
      # Re-enable the rule:
      #
      #   // swiftlint:enable rule_name
      #
      # Disable a rule only for the immediately following line:
      #
      #   // swiftlint:disable:next rule_name
      #
      # Local exceptions should be kept narrow so other source
      # code continues to be checked by the rule.
      #
      - name: Run SwiftLint
        run: swiftlint
